<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Simple is Advanced</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Newsreader', Georgia, serif;
      background: #f3efe6;
      color: #6d665e;
      text-align: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 2.4rem; font-weight: 500; color: #151311; letter-spacing: -0.04em; margin-bottom: 0.5rem; }
    p { margin: 0.5em 0; font-size: 0.95rem; max-width: 28em; }
    .books { display: flex; gap: 2rem; margin-top: 2rem; }
    .books a {
      font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 0.78rem; font-weight: 600; color: #151311;
      text-decoration: none; padding: 0.6rem 1.2rem;
      border: 1px solid #d6cec1; border-radius: 0;
      transition: all 0.2s ease;
    }
    .books a:hover { color: #d43b24; border-color: #d43b24; }
    @media (max-width: 480px) { .books { flex-direction: column; gap: 1rem; } }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist.</p>
  <div class="books">
    <a href="/alignment-industrial-complex/">The Alignment-Industrial Complex</a>
    <a href="/articles/">Articles</a>
  </div>
</body>
</html>
